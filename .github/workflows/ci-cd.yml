name: CI/CD - QA Automation Suite

# Gatilhos:
# - push em qualquer branch, EXCETO main -> ambiente dev
# - pull_request direcionado para main       -> ambiente staging
# - push direto na main (ou seja, um merge)  -> ambiente produção
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:

  # ---------------------------------------------------------------
  # DEV - feedback rápido a cada push em branch de feature
  # ---------------------------------------------------------------
  test-dev:
    name: Testes (dev - smoke)
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Rodar suíte smoke
        run: mvn test -Pdev -Dheadless=true

      - name: Publicar relatório de execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-dev
          path: target/surefire-reports/

  # ---------------------------------------------------------------
  # STAGING - suíte completa a cada Pull Request para main
  # ---------------------------------------------------------------
  test-staging:
    name: Testes (staging - suíte completa)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Rodar suíte completa (API + Integração + E2E)
        run: mvn test -Pstaging -Dheadless=true

      - name: Publicar relatório de execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-staging
          path: target/surefire-reports/

      - name: Publicar resultados do Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-staging
          path: target/allure-results/

  # ---------------------------------------------------------------
  # PRODUÇÃO - smoke tests críticos após merge na main
  # ---------------------------------------------------------------
  test-prod:
    name: Testes (produção - smoke pós-merge)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Rodar suíte smoke pós-deploy
        run: mvn test -Pprod -Dheadless=true

      - name: Publicar relatório de execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-prod
          path: target/surefire-reports/