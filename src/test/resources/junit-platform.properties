# Ativa execução paralela no JUnit 5.
# Este arquivo é lido automaticamente pelo motor de testes (JUnit Platform),
# independente da configuração do Maven Surefire.

junit.jupiter.execution.parallel.enabled = true

# Modo padrão para MÉTODOS: same_thread (sequencial). Métodos da mesma classe
# continuam rodando um após o outro - mais conservador, evita que dois
# métodos que compartilham estado de instância (ex: campos do @BeforeEach)
# rodem ao mesmo tempo sem terem sido desenhados para isso.
junit.jupiter.execution.parallel.mode.default = same_thread

# Modo para CLASSES: concurrent. Cada classe de teste roda em sua própria
# thread, em paralelo com as outras. É aqui que o ThreadLocal<WebDriver>
# do DriverManager (Etapa 3) prova seu valor: cada thread/classe recebe
# seu próprio navegador, sem conflito.
junit.jupiter.execution.parallel.mode.classes.default = concurrent

# Estratégia "fixed": define um número FIXO e conservador de threads,
# em vez de calcular com base nos núcleos de CPU (estratégia "dynamic").
#
# Por que não usar "dynamic" aqui: nossos testes de UI abrem uma instância
# completa do Chrome cada um - são "pesados" (CPU, RAM, I/O), diferente de
# testes leves (como chamadas de API). "dynamic" assume tarefas leves e pode
# tentar abrir Chromes demais ao mesmo tempo, gerando contenção de recursos
# (a máquina trava tentando processar mais do que consegue fisicamente) -
# o que deixa a suíte MAIS LENTA, não mais rápida, além de instável.
#
# Ajuste este valor conforme a capacidade real da máquina que roda os testes
# (dev local vs. runner de CI podem ter capacidades bem diferentes).
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 2